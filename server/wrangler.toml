# Cloudflare Workers config for the J-Quants V2 → 寄与度 proxy.
#   wrangler secret put JQUANTS_API_KEY   (V2 API key from the J-Quants dashboard)
#   wrangler deploy
name = "ni225-heatmap-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# CORS allowlist (comma-separated). The matching request Origin is echoed back;
# other sites' browser JS is blocked. Includes localhost for local dev.
# Adjust to your real embedding origin(s) — add subdomains if the iframe is hosted
# somewhere other than https://markets-lab.com.
ALLOW_ORIGIN = "https://3dheatmap.markets-lab.com,https://markets-lab.com,https://www.markets-lab.com,http://localhost:8000,http://127.0.0.1:8000"

# Secret set via `wrangler secret put` (do NOT put it here):
#   JQUANTS_API_KEY
