# Cloudflare Workers config for the J-Quants → 寄与度 proxy.
#   wrangler secret put JQUANTS_REFRESH_TOKEN   (or JQUANTS_MAILADDRESS + JQUANTS_PASSWORD)
#   wrangler deploy
name = "ni225-heatmap-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Lock this down to your site in production, e.g. "https://markets-lab.com"
ALLOW_ORIGIN = "*"

# Secrets are set via `wrangler secret put` (do NOT put them here):
#   JQUANTS_REFRESH_TOKEN
#   JQUANTS_MAILADDRESS
#   JQUANTS_PASSWORD
