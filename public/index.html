<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>3D 株価指数ヒートマップ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0e14'/%3E%3Crect x='2' y='7' width='3' height='7' fill='%23f5443a'/%3E%3Crect x='6.5' y='3' width='3' height='11' fill='%2322d367'/%3E%3Crect x='11' y='9' width='3' height='5' fill='%23f5443a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="app">
    <div id="stage"></div>

    <!-- Loading veil: visible immediately (before the module runs); hidden once the
         first heatmap frame is painted. JS fills the elapsed counter + localized text.
         On first load a full-screen hyperspace clip plays behind the caption (if the
         bundled MP4 is present): entry → cruising loop while data loads → on arrival
         the clip's exit-to-normal-space segment plays, then a short cross-fade reveals
         the scene. Missing/failed video falls back to the spinner. -->
    <div id="loading">
      <!-- Hyperspace clip. Playback is segment-driven by createLoading (entry 0-4s →
           cruise 4-10s loop → exit 11s+ on arrival), so no native `loop`. Hidden
           unless createLoading confirms it can play. -->
      <video id="ld-video" muted playsinline preload="auto" autoplay aria-hidden="true">
        <source src="./assets/hyperspace.mp4" type="video/mp4" />
      </video>
      <div class="ld-box">
        <div class="ld-spinner" aria-hidden="true"></div>
        <div class="ld-text">Now Loading…</div>
        <div class="ld-elapsed"></div>
        <div class="ld-hint"></div>
      </div>
    </div>

    <div id="legend" class="panel"></div>

    <div id="share" class="panel" role="group" aria-label="share"></div>

    <div id="controls" class="panel">
      <label class="ctl-row" for="opacity">
        <span class="ctl-label" id="lbl-opacity">透明度</span>
        <input id="opacity" class="ctl-slider" type="range" min="0" max="100" step="1" value="0"
               aria-label="opacity" />
        <output id="opacity-val" class="ctl-val">0%</output>
      </label>
      <div class="ctl-row">
        <span class="ctl-label" id="lbl-invert">向き</span>
        <button id="invert" class="toggle-btn" type="button" aria-pressed="false">プラス上 / マイナス下</button>
      </div>
    </div>

    <div id="topright">
      <div id="indices" class="period-bar" role="group" aria-label="index"></div>
      <div id="lang" class="period-bar" role="group" aria-label="language"></div>
    </div>

    <div id="topbar">
      <div id="periods" class="period-bar" role="group" aria-label="対象期間"></div>
      <div id="asof" class="asof"></div>
    </div>

    <div id="timeline" class="panel" role="group" aria-label="timeline"></div>
  </div>

  <!-- Resolve bare specifiers to the vendored Three.js build -->
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js",
      "OrbitControls": "./lib/OrbitControls.js"
    }
  }
  </script>

  <!-- Sample fallbacks (window.HEATMAP_SAMPLE[index]); live data comes from the
       proxies configured in js/data-source.js. Regenerate via scripts/gen_sample*.mjs -->
  <script src="./data/ni225.js"></script>
  <script src="./data/dow30.js"></script>
  <script src="./data/nasdaq100.js"></script>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
